name: 대시보드 갱신

on:
  workflow_dispatch: {}      # 휴대폰 단축어 버튼 / Actions 탭 Run workflow
  push:
    branches: [main]         # CSV·장소 목록을 올리면 바로 반영
  schedule:
    # 1시간마다 (KST 06~24시 = UTC 21~15시)
    - cron: '7 21-23,0-15 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 서울 실시간 자료 받기 + 페이지 만들기
        env:
          SEOUL_KEY: ${{ secrets.SEOUL_KEY }}
          TZ: Asia/Seoul
        run: python build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
