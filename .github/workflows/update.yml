name: 대시보드 갱신

on:
  workflow_dispatch: {}      # 휴대폰 단축어 버튼 / Actions 탭 Run workflow
  push:
    branches: [main]         # CSV·장소 목록을 올리면 바로 반영
  schedule:
    # 10분마다 (KST 06~24시 = UTC 21~15시). GitHub가 예약 실행을 자주 건너뛰어서 자주 시도한다
    - cron: '*/10 21-23,0-15 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: 서울 실시간 자료 받기 + 페이지 만들기
        env:
          SEOUL_KEY: ${{ secrets.SEOUL_KEY }}
          TZ: Asia/Seoul
        run: python3 build.py   # 러너에 기본으로 있는 파이썬 사용 (표준 기능만 씀)

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
